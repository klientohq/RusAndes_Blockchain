name: Deploy site to GitHub Pages

# The site lives in the "RusAndes Raw Website/" subfolder, not the repo root.
# Branch-based Pages can only publish "/" or "/docs", so this workflow
# publishes that folder as the site root instead.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Build public site artifact
        run: |
          mkdir -p public-site/assets public-site/css public-site/js public-site/en
          cp "RusAndes Raw Website/.nojekyll" public-site/.nojekyll
          cp "RusAndes Raw Website/CNAME" public-site/CNAME
          cp "RusAndes Raw Website/404.html" public-site/404.html
          cp "RusAndes Raw Website/index.html" public-site/index.html
          cp "RusAndes Raw Website/international-programs.html" public-site/international-programs.html
          cp "RusAndes Raw Website/global-markets.html" public-site/global-markets.html
          cp "RusAndes Raw Website/accommodation-services.html" public-site/accommodation-services.html
          cp "RusAndes Raw Website/digital-systems.html" public-site/digital-systems.html
          cp "RusAndes Raw Website/privacy.html" public-site/privacy.html
          cp "RusAndes Raw Website/terms.html" public-site/terms.html
          cp "RusAndes Raw Website/robots.txt" public-site/robots.txt
          cp "RusAndes Raw Website/sitemap.xml" public-site/sitemap.xml
          cp "RusAndes Raw Website/assets/ceo-photo.jpg" public-site/assets/ceo-photo.jpg
          cp "RusAndes Raw Website/assets/international-programs-hero.jpg" public-site/assets/international-programs-hero.jpg
          cp "RusAndes Raw Website/assets/global-markets-social.png" public-site/assets/global-markets-social.png
          cp "RusAndes Raw Website/assets/global-markets-hero.webp" public-site/assets/global-markets-hero.webp
          cp "RusAndes Raw Website/assets/accommodation-social.webp" public-site/assets/accommodation-social.webp
          cp "RusAndes Raw Website/assets"/bogota-model-*.webp public-site/assets/
          cp "RusAndes Raw Website/assets/digital-systems-hero.webp" public-site/assets/digital-systems-hero.webp
          cp "RusAndes Raw Website/assets/digital-systems-social.webp" public-site/assets/digital-systems-social.webp
          cp "RusAndes Raw Website/css/style.css" public-site/css/style.css
          cp "RusAndes Raw Website/css/legal.css" public-site/css/legal.css
          cp "RusAndes Raw Website/css/international-programs.css" public-site/css/international-programs.css
          cp "RusAndes Raw Website/css/global-markets.css" public-site/css/global-markets.css
          cp "RusAndes Raw Website/css/accommodation-services.css" public-site/css/accommodation-services.css
          cp "RusAndes Raw Website/css/digital-systems.css" public-site/css/digital-systems.css
          cp "RusAndes Raw Website/js/main.js" public-site/js/main.js
          cp "RusAndes Raw Website/en/index.html" public-site/en/index.html
          cp "RusAndes Raw Website/en/international-programs.html" public-site/en/international-programs.html
          cp "RusAndes Raw Website/en/global-markets.html" public-site/en/global-markets.html
          cp "RusAndes Raw Website/en/accommodation-services.html" public-site/en/accommodation-services.html
          cp "RusAndes Raw Website/en/digital-systems.html" public-site/en/digital-systems.html
          cp "RusAndes Raw Website/en/privacy.html" public-site/en/privacy.html
          cp "RusAndes Raw Website/en/terms.html" public-site/en/terms.html

      - name: Upload site folder as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public-site'

      - id: deployment
        uses: actions/deploy-pages@v4
